<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening OneLoop…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #12141c;
      color: #f0f2fa;
      text-align: center;
      padding: 24px;
    }
    a { color: #8cb3ff; }
    .muted { color: #adbad1; font-size: 14px; margin-top: 12px; }
    .links { display: grid; gap: 10px; margin-top: 16px; }
  </style>
  <script>
    (function () {
      // Supabase may return tokens in the query (PKCE) or hash (implicit).
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var qs = search + hash;
      // Current app uses oneloopuiv2://; keep oneloop:// for older builds.
      var primary = "oneloopuiv2://auth-callback" + qs;
      var legacy = "oneloop://auth-callback" + qs;

      window.location.replace(primary);

      window.addEventListener("DOMContentLoaded", function () {
        var link = document.getElementById("open-link");
        var legacyLink = document.getElementById("legacy-link");
        var fallback = document.getElementById("fallback");
        if (link) link.href = primary;
        if (legacyLink) legacyLink.href = legacy;
        setTimeout(function () {
          if (fallback) fallback.style.display = "block";
        }, 900);
      });
    })();
  </script>
</head>
<body>
  <div>
    <h1>Opening OneLoop…</h1>
    <p class="muted">Finishing sign-in and returning to the app.</p>
    <div id="fallback" style="display:none" class="links">
      <a id="open-link">Tap here if OneLoop doesn’t open</a>
      <a id="legacy-link" class="muted">Open with older OneLoop build</a>
    </div>
  </div>
</body>
</html>
